services:
  db:
    image: 'mysql:8.4'
    environment:
      - 'MYSQL_DATABASE=enqueteme'
      - 'MYSQL_PASSWORD=will2009'
      - 'MYSQL_ROOT_PASSWORD=root'
      - 'MYSQL_USER=will'
    ports:
      - '3306'
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build: ./api
    environment:
      SPRING_DATASOURCE_URL: 'jdbc:mysql://db:3306/enqueteme'
      SPRING_DATASOURCE_USERNAME: 'will'
      SPRING_DATASOURCE_PASSWORD: 'will2009'
      SPRING_JPA_HIBERNATE_DDL_AUTO: 'update'
      SPRING_DOCKER_COMPOSE_ENABLED: 'false'
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - '4200:80'
    depends_on:
      - api
