<img src="assets/logo.png" alt="" class="logo">

<div class="container">
  <div tuiAppearance="floating" tuiCardLarge class="login-card">
    <header tuiHeader>
      <h1 tuiTitle>
        Entrar
        <span tuiSubtitle>Use sua conta Google para continuar</span>
      </h1>
      <aside tuiAccessories>
        <tui-avatar appearance="primary" src="@tui.star" />
      </aside>
    </header>

    @if (loginFailed) {
      <p class="login-error">Não foi possível entrar com o Google. Tente novamente.</p>
    }

    <footer>
      <a
        href="/api/auth/google"
        size="m" 
        style="width: 100%;" 
        tuiButton
      >Continuar com o Google</a>
      <button 
        size="m" 
        style="width: 100%;" 
        appearance="flat" 
        tuiButton 
        type="button" 
        routerLink="/polls" 
      >Voltar às enquetes
    </button>
    </footer>
  </div>
</div>
