<app-navbar></app-navbar>

<main class="content">
  <h1 class="page-title">Editar Enquete</h1>

  @if (loading()) {
    <p class="state-message">Carregando...</p>
  } @else if (pollNotFound()) {
    <p class="state-message">Enquete não encontrada.</p>
  } @else {
    <form [formGroup]="editForm" (ngSubmit)="onSubmit()" class="edit-form">
      <div class="form-group">
        <label for="title" class="form-label">Título</label>
        <input id="title" type="text" formControlName="title" class="form-input" />
      </div>

      <div class="form-group">
        <label class="form-label">Opções</label>
        <div formArrayName="options" class="options-list">
          @for (option of options.controls; track $index) {
            <div class="option-row">
              <input
                type="text"
                [formControl]="option"
                class="form-input"
                [placeholder]="'Opção ' + ($index + 1)"
              />
              @if (options.length > 2) {
                <button type="button" class="btn btn-remove" (click)="removeOption($index)">
                  Remover
                </button>
              }
            </div>
          }
        </div>
        <button type="button" class="btn btn-add" (click)="addOption()">
          Adicionar opção
        </button>
      </div>

      <div class="form-group inline">
        <label class="form-label checkbox-label">
          <input type="checkbox" formControlName="voteRequireLogin" />
          Exigir login para votar
        </label>
      </div>

      <div class="form-group">
        <label for="expiration" class="form-label">Duração (dias)</label>
        <input
          id="expiration"
          type="number"
          formControlName="pollExpirationInDays"
          class="form-input short"
          min="1"
        />
      </div>

      @if (errorMessage()) {
        <p class="form-error">{{ errorMessage() }}</p>
      }

      <div class="form-actions">
        <a routerLink="/my-polls" class="btn btn-cancel">Cancelar</a>
        <button
          type="submit"
          class="btn btn-save"
          [disabled]="saving() || editForm.invalid"
        >
          {{ saving() ? 'Salvando...' : 'Salvar' }}
        </button>
      </div>
    </form>
  }
</main>
