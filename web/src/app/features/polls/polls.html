<app-navbar></app-navbar>
<main class="content">
  @let polls = polls$ | async;

  @if(polls?.length) {
    <div class="poll-list">
      @for(poll of polls; track poll.id) {
        <app-poll [pollData]="poll"></app-poll>
      }
    </div>
  } @else {
    <div class="no-polls">
      <h1>Nenhuma enquete encontrada</h1>
    </div>
  }
</main>
