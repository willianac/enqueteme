<header class="navbar">
  <div class="navbar-content">
    <img src="assets/logo-clean.png" alt="Enqueteme" class="logo" routerLink="/">
    <nav class="navigation">
      @if(user(); as currentUser) {
        <div class="user-menu-container">
          <button
            tuiButton
            appearance="flat"
            size="s"
            type="button"
            class="user-trigger"
            (click)="toggleMenu($event)"
          >
            <tui-icon icon="@tui.circle-user" class="user-avatar-icon" />
            <span class="user-name">Olá, {{ currentUser.name }}</span>
            <tui-icon [icon]="open() ? '@tui.chevron-up' : '@tui.chevron-down'" class="chevron-icon" />
          </button>

          @if (open()) {
            <div tuiSurface="floating" class="user-dropdown-panel" (click)="$event.stopPropagation()">
              <div class="user-dropdown-header">
                <span class="dropdown-greeting">Conectado como</span>
                <span class="dropdown-username">{{ currentUser.name }}</span>
              </div>
              <div class="dropdown-items">
                <a routerLink="/my-polls" class="dropdown-item" (click)="open.set(false)">
                  <tui-icon icon="@tui.list" class="menu-icon" />
                  <span>Minhas enquetes</span>
                </a>
                <button type="button" class="dropdown-item text-negative" (click)="logout()">
                  <tui-icon icon="@tui.log-out" class="menu-icon" />
                  <span>Sair</span>
                </button>
              </div>
            </div>
          }
        </div>
      } @else {
        <button
          tuiButton
          appearance="flat"
          size="s"
          [style.color]="'var(--tui-background-accent-1)'"
          routerLink="/signin"
        >
          Entrar
        </button>
      }
      <button tuiButton size="s" routerLink="/new-poll">
        Nova enquete
        <tui-icon icon="@tui.plus" [style.height.rem]="1" />
      </button>
    </nav>
  </div>
</header>
